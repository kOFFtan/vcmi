name: AutoHeroes Android ARM64

on:
  push:
    branches:
      - feature/auto-heroes
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-arm64:
    name: Build AutoHeroes ARM64
    runs-on: ubuntu-24.04

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Conan dependencies
        run: |
          pipx install conan
          source "${GITHUB_WORKSPACE}/CI/install_conan_dependencies.sh" \
            dependencies-android-arm64-v8a

      - name: Setup compiler cache
        uses: step-security/ccache-action@v1
        with:
          key: autoheroes-android-arm64
          restore-keys: |
            android-64-
          max-size: 5G
          verbose: 2
          job-summary: ""

      - name: Configure ccache
        run: |
          echo "/usr/lib/ccache" >> "$GITHUB_PATH"
          ccache --set-config=compiler_check=content
          ccache --set-config=base_dir="${GITHUB_WORKSPACE}"
          ccache --set-config=hash_dir=true
          ccache --set-config=sloppiness=time_macros

      - name: Install Conan Android profile
        run: |
          conan profile detect
          conan install . \
            --output-folder=conan-generated \
            --build=never \
            --profile=dependencies/conan_profiles/android-64-ndk \
            --conf="tools.cmake.cmaketoolchain:generator=Ninja" \
            --profile=dependencies/conan_profiles/base/android-system

      - name: Configure Android Gradle
        run: |
          mkdir -p ~/.gradle
          echo "android.bundle.enableUncompressedNativeLibs=true" \
            > ~/.gradle/gradle.properties

      - name: Install Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Free disk space
        run: |
          sudo rm -rf /opt/ghc /usr/local/.ghcup /usr/share/dotnet || true
          df -h

      - name: Configure VCMI
        run: |
          gradleProperties=$(python3 CI/android/gradle_daily_props.py)

          cmake \
            -DENABLE_CCACHE:BOOL=ON \
            "-DANDROID_GRADLE_PROPERTIES=$gradleProperties" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            --preset android-conan-ninja-release

      - name: Build VCMI AutoHeroes
        run: |
          cmake --build --preset android-conan-ninja-release
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Prepare APK
        run: |
          APK="out/build/android-conan-ninja-release/android-build/vcmi-app/build/outputs/apk/release/vcmi-release.apk"

          test -f "$APK"

          cp "$APK" VCMI-AutoHeroes-arm64-v8a.apk

          ls -lh VCMI-AutoHeroes-arm64-v8a.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: VCMI-AutoHeroes-arm64-v8a
          path: VCMI-AutoHeroes-arm64-v8a.apk
          archive: false
